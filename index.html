<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хотелки</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10152A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Хотелки">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#18213B; --muted:#5E6782; --line:#D5DAE5;
  --accent:#6E56CF; --bought:#2F9E6B; --gone:#8A90A6; --danger:#E5484D;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#10152A;--surface:#1A2140;--ink:#E9ECF5;--muted:#9AA3BF;--line:#2C3559;--accent:#A08CFF;--bought:#4CC38A;--gone:#7D84A0;--danger:#FF6B6F}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10152A;--surface:#1A2140;--ink:#E9ECF5;--muted:#9AA3BF;--line:#2C3559;--accent:#A08CFF;--bought:#4CC38A;--gone:#7D84A0;--danger:#FF6B6F}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 120px}
h1{font:700 28px/1.1 Unbounded,Onest,system-ui,sans-serif;margin:8px 0 18px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font:500 15px Onest,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs .c{opacity:.6;margin-left:4px}

ol{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 4px;margin-bottom:8px;position:relative}
.item.drag{z-index:5;box-shadow:0 10px 30px rgba(10,14,30,.25);border-color:var(--accent)}
.handle{width:36px;height:44px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border:0;background:transparent;border-radius:10px}
.handle:active{cursor:grabbing}
.handle svg{width:16px;height:16px}
.body{min-width:0;cursor:pointer}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
.acts{display:flex;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 10px;font:500 13px Onest,sans-serif;cursor:pointer;white-space:nowrap}
.chip.buy:hover{border-color:var(--bought);color:var(--bought)}
.chip.gone:hover{border-color:var(--gone);color:var(--gone)}

.hist .item{grid-template-columns:1fr auto;padding-left:14px}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px}
.badge.b{background:color-mix(in srgb,var(--bought) 15%,transparent);color:var(--bought)}
.badge.g{background:color-mix(in srgb,var(--gone) 18%,transparent);color:var(--gone)}
.hist .name.g{color:var(--muted)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 26px;font:600 16px Onest,sans-serif;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);cursor:pointer;z-index:6}

.backdrop{position:fixed;inset:0;background:rgba(10,14,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.backdrop.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font:700 18px Unbounded,Onest,sans-serif;margin:0 0 16px}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.f input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:16px Onest,sans-serif}
.f input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--danger);font-size:13px;min-height:18px}
.actions{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font:600 16px Onest,sans-serif;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{flex:0 0 auto;background:transparent;color:var(--danger);border:1.5px solid var(--danger);padding:13px 16px}
button:focus-visible,input:focus-visible,.body:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin-top:18px}
.backup{margin-top:28px;font-size:13px;color:var(--muted)}
.backup .btn{font-size:15px;padding:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Хотелки</h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabWant" aria-selected="true">Хочу<span class="c num" id="cWant"></span></button>
    <button role="tab" id="tabHist" aria-selected="false">История<span class="c num" id="cHist"></span></button>
  </div>
  <section id="viewWant">
    <ol id="list"></ol>
    <p class="hint" id="hint">Тяни за ⋮⋮, чтобы поменять порядок. Сверху — то, что важнее. Нажми на название, чтобы изменить.</p>
  </section>
  <section id="viewHist" class="hist" hidden><ol id="hist"></ol>
    <div class="backup">
      <p>Список хранится только на этом телефоне. Время от времени сохраняй копию, чтобы не потерять его, если удалишь приложение.</p>
      <div class="actions"><button type="button" class="btn ghost" id="exp">Сохранить копию</button><button type="button" class="btn ghost" id="imp">Восстановить</button></div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <p class="num" id="bkMsg" role="status"></p>
    </div>
  </section>
</div>

<button class="fab" id="add">+ Добавить</button>

<div class="backdrop" id="bd" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form class="sheet" id="form" novalidate>
    <h3 id="sheetTitle">Новая хотелка</h3>
    <div class="f"><label for="fName">Что хочу</label><input id="fName" autocomplete="off" placeholder="Например, хорошие наушники"></div>
    <div class="f"><label for="fPrice">Примерная цена</label><input id="fPrice" inputmode="numeric" class="num" placeholder="Можно не указывать"></div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="del" hidden>Удалить</button>
      <button type="button" class="btn ghost" id="cancel">Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>
  </form>
</div>

<script>
const KEY='wishes-v1';
let state={items:[]}; // {id,name,price,addedAt,status:'want'|'bought'|'gone',closedAt}
let editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseNum=s=>{const n=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isFinite(n)&&n>0?n:0};
const money=n=>'≈\u00A0'+Math.round(n).toLocaleString('ru-RU')+'\u00A0₽';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pl=(n,f)=>{const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<12||b>14)?f[1]:f[2])};
function dur(ms){
  const d=Math.floor(ms/864e5);
  if(d<1)return 'с сегодня';
  if(d<14)return pl(d,['день','дня','дней']);
  if(d<60)return pl(Math.floor(d/7),['неделю','недели','недель']);
  if(d<365)return pl(Math.floor(d/30.4),['месяц','месяца','месяцев']);
  return pl(Math.floor(d/365),['год','года','лет']);
}
const fmtDate=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:new Date(t).getFullYear()===new Date().getFullYear()?undefined:'numeric'});

function load(){try{const s=localStorage.getItem(KEY);if(s){const v=JSON.parse(s);if(v&&Array.isArray(v.items))state=v}}catch(e){}}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
}

const grip='<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="13" r="1.5"/><circle cx="11" cy="13" r="1.5"/></svg>';

function render(){
  const want=state.items.filter(i=>i.status==='want');
  const hist=state.items.filter(i=>i.status!=='want').sort((a,b)=>b.closedAt-a.closedAt);
  $('cWant').textContent=want.length?' '+want.length:'';
  $('cHist').textContent=hist.length?' '+hist.length:'';
  $('hint').hidden=want.length<2;

  const ol=$('list');ol.innerHTML='';
  if(!want.length)ol.innerHTML='<li class="empty">Пока пусто. Добавь первую хотелку кнопкой внизу.</li>';
  want.forEach(it=>{
    const li=document.createElement('li');li.className='item';li.dataset.id=it.id;
    li.innerHTML=`<button class="handle" aria-label="Перетащить «${esc(it.name)}». Стрелки вверх и вниз двигают">${grip}</button>
      <div class="body" tabindex="0"><div class="name">${esc(it.name)}</div>
        <div class="meta num">${it.price?`<span>${money(it.price)}</span>`:''}<span>хочу ${dur(Date.now()-it.addedAt)}</span></div></div>
      <div class="acts"><button class="chip buy">Купил</button><button class="chip gone">Перехотел</button></div>`;
    li.querySelector('.body').addEventListener('click',()=>openSheet(it));
    li.querySelector('.body').addEventListener('keydown',e=>{if(e.key==='Enter')openSheet(it)});
    li.querySelector('.buy').onclick=()=>close(it,'bought');
    li.querySelector('.gone').onclick=()=>close(it,'gone');
    setupDrag(li,li.querySelector('.handle'));
    ol.appendChild(li);
  });

  const hl=$('hist');hl.innerHTML='';
  if(!hist.length)hl.innerHTML='<li class="empty">Здесь появится то, что ты купил или перехотел.</li>';
  hist.forEach(it=>{
    const b=it.status==='bought';
    const li=document.createElement('li');li.className='item';
    li.innerHTML=`<div><div class="name ${b?'':'g'}">${esc(it.name)}</div>
      <div class="meta num"><span class="badge ${b?'b':'g'}">${b?'Купил':'Перехотел'} ${fmtDate(it.closedAt)}</span>${it.price?`<span>${money(it.price)}</span>`:''}<span>хотел ${dur(it.closedAt-it.addedAt)}</span></div></div>
      <button class="chip">Вернуть</button>`;
    li.querySelector('.chip').onclick=()=>{
      it.status='want';it.closedAt=null;
      state.items=state.items.filter(x=>x!==it);state.items.push(it);persist();render();
    };
    hl.appendChild(li);
  });
}

function close(it,status){it.status=status;it.closedAt=Date.now();persist();render()}

function saveOrderFromDom(){
  const ids=[...$('list').querySelectorAll('.item')].map(li=>li.dataset.id);
  const want=ids.map(id=>state.items.find(i=>i.id===id));
  state.items=want.concat(state.items.filter(i=>i.status!=='want'));
  persist();
}

function setupDrag(li,h){
  let active=false;
  h.addEventListener('pointerdown',e=>{
    active=true;h.setPointerCapture(e.pointerId);li.classList.add('drag');e.preventDefault();
  });
  h.addEventListener('pointermove',e=>{
    if(!active)return;
    const y=e.clientY;
    let p=li.previousElementSibling;
    while(p&&y<p.getBoundingClientRect().top+p.offsetHeight/2){li.parentNode.insertBefore(li,p);p=li.previousElementSibling}
    let n=li.nextElementSibling;
    while(n&&y>n.getBoundingClientRect().top+n.offsetHeight/2){li.parentNode.insertBefore(n,li);n=li.nextElementSibling}
    if(y<60)window.scrollBy(0,-8);else if(y>innerHeight-90)window.scrollBy(0,8);
  });
  const end=()=>{if(!active)return;active=false;li.classList.remove('drag');saveOrderFromDom()};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'&&li.previousElementSibling){li.parentNode.insertBefore(li,li.previousElementSibling);h.focus();saveOrderFromDom();e.preventDefault()}
    if(e.key==='ArrowDown'&&li.nextElementSibling){li.parentNode.insertBefore(li.nextElementSibling,li);h.focus();saveOrderFromDom();e.preventDefault()}
  });
}

function openSheet(it){
  editing=it||null;
  $('sheetTitle').textContent=it?'Изменить':'Новая хотелка';
  $('fName').value=it?it.name:'';$('fPrice').value=it&&it.price?it.price:'';
  $('del').hidden=!it;$('err').textContent='';
  $('bd').classList.add('open');setTimeout(()=>$('fName').focus(),50);
}
function closeSheet(){$('bd').classList.remove('open');editing=null}
$('add').onclick=()=>openSheet();
$('cancel').onclick=closeSheet;
$('bd').addEventListener('click',e=>{if(e.target===$('bd'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('del').onclick=()=>{state.items=state.items.filter(i=>i!==editing);persist();closeSheet();render()};
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('fName').value.trim();
  if(!name){$('err').textContent='Напиши, что хочешь.';return}
  const price=parseNum($('fPrice').value);
  if(editing){editing.name=name;editing.price=price}
  else state.items.push({id:uid(),name,price,addedAt:Date.now(),status:'want',closedAt:null});
  persist();closeSheet();render();
});

function tab(h){
  $('tabWant').setAttribute('aria-selected',!h);$('tabHist').setAttribute('aria-selected',h);
  $('viewWant').hidden=h;$('viewHist').hidden=!h;$('add').hidden=h;
}
$('tabWant').onclick=()=>tab(false);$('tabHist').onclick=()=>tab(true);
if(location.hash==='#history')tab(true);

load();render();

$('exp').onclick=async()=>{
  const json=JSON.stringify(state,null,1);
  const name='hotelki-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([json],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Хотелки — копия'});$('bkMsg').textContent='Копия готова.';return}
  }catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
  $('bkMsg').textContent='Копия сохранена.';
};
$('imp').onclick=()=>$('impFile').click();
$('impFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const v=JSON.parse(await f.text());
    if(!v||!Array.isArray(v.items))throw 0;
    if(state.items.length&&!confirm('Заменить текущий список на копию?'))return;
    state=v;persist();render();$('bkMsg').textContent='Восстановлено: '+v.items.length+' шт.';
  }catch(err){$('bkMsg').textContent='Это не файл копии «Хотелок». Выбери файл hotelki-….json.'}
  e.target.value='';
};

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
// Refresh "хочу N дней" when the app comes back to the foreground
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script>
</body>
</html>
